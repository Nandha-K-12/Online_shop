{% extends "shop/base.html" %}
{% load static i18n %}

{% block title %}
  {{ product.name }}
{% endblock %}

{% block content %}
  <div class="product-detail">
    <img src="{% if product.image %}{{ product.image.url }}{% else %}{% static "img/no_image.png" %}{% endif %}" alt="{{ product.name }}">
    <div class="info">
      <h1>{{ product.name }}</h1>
      <h2>
        <a href="{{ product.category.get_absolute_url }}">
          {{ product.category }}
        </a>
      </h2>
      <p class="price">${{ product.price }}</p>
      <form action="{% url "cart:cart_add" product.id %}" method="post" class="add-to-cart-form">
        {{ cart_product_form }}
        {% csrf_token %}
        <input type="submit" value="{% trans "Add to cart" %}" class="button">
      </form>
      <div class="product-description">
        {{ product.description|linebreaks }}
      </div>
    </div>
  </div>
{% endblock %}
